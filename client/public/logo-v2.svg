<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="b-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B026FF"/><stop offset="100%" stop-color="#8A19D6"/>
    </linearGradient>
    <linearGradient id="b-yellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD000"/><stop offset="100%" stop-color="#EAA800"/>
    </linearGradient>
    <linearGradient id="b-pink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3B7A"/><stop offset="100%" stop-color="#D81B5B"/>
    </linearGradient>
  </defs>

  <!-- Outer glow ring -->
  <circle cx="256" cy="256" r="234" fill="none" stroke="rgba(176,38,255,0.12)" stroke-width="18"/>

  <!-- 16-point starburst -->
  <polygon
    points="256,28 315,113 417,95 399,197 484,256 399,315 417,417 315,399 256,484 197,399 95,417 113,315 28,256 113,197 95,95 197,113"
    fill="#1E293B" stroke="#B026FF" stroke-width="6" stroke-linejoin="round"/>

  <!-- O tile (purple) -->
  <g transform="translate(134, 211)">
    <animateTransform attributeName="transform" type="translate" additive="sum"
      values="0,0; 0,-7; 0,0" dur="2.4s" begin="0s" repeatCount="indefinite"
      calcMode="spline" keyTimes="0;0.5;1" keySplines="0.45 0 0.55 1; 0.45 0 0.55 1"/>
    <rect x="0" y="8" width="76" height="90" rx="13" fill="#050B15" opacity="0.6"/>
    <rect x="0" y="0" width="76" height="90" rx="13" fill="url(#b-purple)" stroke="#1E293B" stroke-width="7"/>
    <text x="38" y="64" font-family="'Space Grotesk', system-ui, sans-serif"
          font-size="50" font-weight="900" text-anchor="middle" fill="#FFFFFF">O</text>
  </g>

  <!-- R tile (yellow) -->
  <g transform="translate(218, 211)">
    <animateTransform attributeName="transform" type="translate" additive="sum"
      values="0,0; 0,-7; 0,0" dur="2.4s" begin="0.28s" repeatCount="indefinite"
      calcMode="spline" keyTimes="0;0.5;1" keySplines="0.45 0 0.55 1; 0.45 0 0.55 1"/>
    <rect x="0" y="8" width="76" height="90" rx="13" fill="#050B15" opacity="0.6"/>
    <rect x="0" y="0" width="76" height="90" rx="13" fill="url(#b-yellow)" stroke="#1E293B" stroke-width="7"/>
    <text x="38" y="64" font-family="'Space Grotesk', system-ui, sans-serif"
          font-size="50" font-weight="900" text-anchor="middle" fill="#1E293B">R</text>
  </g>

  <!-- D tile (pink) -->
  <g transform="translate(302, 211)">
    <animateTransform attributeName="transform" type="translate" additive="sum"
      values="0,0; 0,-7; 0,0" dur="2.4s" begin="0.56s" repeatCount="indefinite"
      calcMode="spline" keyTimes="0;0.5;1" keySplines="0.45 0 0.55 1; 0.45 0 0.55 1"/>
    <rect x="0" y="8" width="76" height="90" rx="13" fill="#050B15" opacity="0.6"/>
    <rect x="0" y="0" width="76" height="90" rx="13" fill="url(#b-pink)" stroke="#1E293B" stroke-width="7"/>
    <text x="38" y="64" font-family="'Space Grotesk', system-ui, sans-serif"
          font-size="50" font-weight="900" text-anchor="middle" fill="#FFFFFF">D</text>
  </g>

  <!-- ARENA text inside burst -->
  <text x="256" y="362" font-family="'Space Grotesk', system-ui, sans-serif"
        font-size="28" font-weight="800" text-anchor="middle" fill="#FFFFFF" letter-spacing="10">ARENA</text>
</svg>
